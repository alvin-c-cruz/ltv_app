{% extends "layout.html" %}
{% block main %}
<h1>Add Holiday</h1>
<form method="post">
  {{ form.csrf_token }}
  <p>{{ form.currency_id.label }} {{ form.currency_id() }}</p>
  <p>{{ form.holiday_date.label }} {{ form.holiday_date() }}</p>
  <button type="submit">Save</button>
</form>
{% endblock %}
