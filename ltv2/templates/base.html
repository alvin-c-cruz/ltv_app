<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>{% block title %}LTV2{% endblock %}</title></head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}<p class="flash {{ category }}">{{ msg }}</p>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
