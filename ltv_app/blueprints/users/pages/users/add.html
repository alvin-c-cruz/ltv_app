{% extends 'base.html' %}

{% block content %}
<h1>Add User</h1>

<form method="post" class="page-form">

    <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control"
               value="{{ form.username }}" required autofocus autocomplete="off">
    </div>

    <div class="form-row" style="grid-template-columns:1fr 1fr">
        <div class="form-group">
            <label class="form-label">Email <span style="font-weight:400;color:var(--text-muted)">(optional)</span></label>
            <input type="email" name="email" class="form-control" value="{{ form.email }}">
        </div>
        <div class="form-group">
            <label class="form-label">Role</label>
            <select name="role" class="form-control">
                {% for role in roles %}
                <option value="{{ role }}" {% if form.role == role %}selected{% endif %}>
                    {{ role|capitalize }}
                </option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="form-row" style="grid-template-columns:1fr 1fr">
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm" class="form-control" required>
        </div>
    </div>

    <div style="display:flex; gap:0.5rem; margin-top:0.5rem">
        <button type="submit" class="btn btn-primary">Create User</button>
        <a href="{{ url_for('users.home') }}" class="btn btn-outline">Cancel</a>
    </div>

</form>
{% endblock %}
