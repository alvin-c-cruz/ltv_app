{% extends 'base.html' %}

{% block content %}
<h1>Edit User</h1>

<div class="card" style="max-width:480px">
    <div class="card-body">
        <form method="post">

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control"
                       value="{{ form.username }}" required autofocus autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label">Email <span style="color:var(--text-muted);font-weight:400">(optional)</span></label>
                <input type="email" name="email" class="form-control" value="{{ form.email }}">
            </div>

            <div class="form-group">
                <label class="form-label">Role</label>
                <select name="role" class="form-control">
                    {% for role in roles %}
                    <option value="{{ role }}" {% if form.role == role %}selected{% endif %}>
                        {{ role|capitalize }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Level</label>
                <select name="level" class="form-control">
                    {% for value, label in levels %}
                    <option value="{{ value }}" {% if form.level == value %}selected{% endif %}>
                        {{ value }} — {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div style="display:flex; gap:0.5rem; margin-top:1.25rem">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('users.change_password', user_id=form.id) }}" class="btn btn-outline">Change Password</a>
                <a href="{{ url_for('users.home') }}" class="btn btn-outline">Cancel</a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
