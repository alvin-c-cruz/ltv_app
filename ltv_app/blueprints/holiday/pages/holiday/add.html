{% extends 'base.html' %}

{% block content %}
<h1>Add Holiday</h1>

<form method="post" action="{{ url_for('holiday.add') }}" class="page-form mt-3">
    {{ csrf_token }}
    <div class="form-row">
        <div class="form-group">
            <label for="holi_date">Date</label>
            <input type="date" name="holi_date" id="holi_date" required>
        </div>
        <div class="form-group">
            <label for="ccy_ref">Currency</label>
            <select name="ccy_ref" id="ccy_ref" required>
                <option value=""></option>
                {% for ccy in ccys %}
                <option value="{{ ccy.ref_num }}">{{ ccy.ccy_id }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{{ url_for('holiday.home') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
