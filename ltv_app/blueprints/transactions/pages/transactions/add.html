{% extends 'base.html' %}

{% block content %}
<h1>Add Transaction</h1>

<form method="post" action="{{ url_for('transactions.add') }}" class="page-form mt-3">
    <div class="form-row">
        <div class="form-group">
            <label for="trade_date">Trade Date</label>
            <input type="date" name="trade_date" id="trade_date" value="{{ form.trade_date }}" required autofocus>
        </div>
        <div class="form-group">
            <label for="value_date">Value Date</label>
            <input type="date" name="value_date" id="value_date" value="{{ form.value_date }}" required>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="bank_ref">Account</label>
            <select name="bank_ref" id="bank_ref" required>
                <option value=""></option>
                {% for bank in g.bank_accounts %}
                <option value="{{ bank.ref_num }}"{% if form.bank_ref == bank.ref_num %} selected{% endif %}>
                    {{ bank.bank_id }}: {{ bank.bank_name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="code_ref">Stock</label>
            <select name="code_ref" id="code_ref" required>
                <option value=""></option>
                {% for stock in g.stocks %}
                <option value="{{ stock.ref_num }}"{% if form.code_ref == stock.ref_num %} selected{% endif %}>
                    {{ stock.code }}: {{ stock.stock_name }}
                </option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label for="transaction_type">Transaction Type</label>
        <select name="transaction_type" id="transaction_type" required>
            <option value=""></option>
            {% for option in transaction_types %}
            <option value="{{ option[0] }}"{% if option[0] == form.transaction_type %} selected{% endif %}>
                {{ option[1] }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="text" name="quantity" id="quantity" value="{{ form.quantity }}" autocomplete="off" required>
        </div>
        <div class="form-group">
            <label for="price">Price</label>
            <input type="text" name="price" id="price" value="{{ form.price }}" autocomplete="off" required>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{{ url_for('transactions.home') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
