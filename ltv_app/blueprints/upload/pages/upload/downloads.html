{% extends 'base.html' %}

{% block content %}
<h1>Downloads</h1>

<div class="table-wrap" style="margin-top:1.25rem">
    {% if files %}
    <table class="table" style="table-layout:fixed; width:100%">
        <colgroup>
            <col style="width:80%">
            <col style="width:20%">
        </colgroup>
        <thead>
            <tr>
                <th>Filename</th>
                <th class="text-center">Download</th>
            </tr>
        </thead>
        <tbody>
        {% for file in files %}
        <tr>
            <td>{{ file }}</td>
            <td class="text-center">
                <a href="{{ url_for('upload.download_file', filename=file) }}" class="btn btn-outline btn-sm">Download</a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p style="color:var(--text-muted)">No files available.</p>
    {% endif %}
</div>
{% endblock %}
