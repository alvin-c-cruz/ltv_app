{% extends 'base.html' %}

{% block content %}
<h1>Edit Report Label</h1>

<div class="card" style="max-width:480px">
    <div class="card-body">
        <table class="table mb-3" style="table-layout:fixed">
            <tbody>
                <tr><th style="width:35%">Bank ID</th><td>{{ account.bank_id }}</td></tr>
                <tr><th>Bank Name</th><td>{{ account.bank_name }}</td></tr>
            </tbody>
        </table>

        <form method="post">
            <div class="form-group">
                <label class="form-label">Report Label
                    <span style="font-size:0.8rem; color:var(--text-muted); font-weight:400;">
                        — used in Excel cell A1. Leave blank to use bank name.
                    </span>
                </label>
                <input type="text" name="report_label" class="form-control"
                       value="{{ account.report_label or '' }}"
                       placeholder="{{ account.bank_name }}">
            </div>
            <div style="display:flex; gap:0.5rem; margin-top:1rem">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{{ url_for('bank_accounts.home') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
