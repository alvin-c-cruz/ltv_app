{% extends 'base.html' %}

{% block content %}
<h1>Bank Accounts</h1>

<div class="mt-3" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:1rem;">
    <div style="display:flex; gap:6px;">
        <a href="{{ url_for('bank_accounts.home', show='active') }}"
           class="btn btn-sm {% if show == 'active' %}btn-primary{% else %}btn-outline{% endif %}">
            Active
        </a>
        <a href="{{ url_for('bank_accounts.home', show='all') }}"
           class="btn btn-sm {% if show == 'all' %}btn-primary{% else %}btn-outline{% endif %}">
            All
        </a>
    </div>
    <span class="text-muted" style="font-size:0.85rem;">
        {{ accounts|length }} account{{ 's' if accounts|length != 1 }}
    </span>
</div>

<div class="table-wrap">
    <table class="table" style="table-layout:fixed; width:100%">
        <colgroup>
            <col style="width:8%">
            <col style="width:42%">
            <col style="width:20%">
            <col style="width:30%">
        </colgroup>
        <thead>
            <tr>
                <th class="text-center">Priority</th>
                <th>Bank Name</th>
                <th>Bank ID</th>
                <th class="text-center">Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for acc in accounts %}
        <tr {% if not acc.is_active %}style="opacity:0.5"{% endif %}>
            <td class="text-center">{{ acc.priority }}</td>
            <td>{{ acc.bank_name }}</td>
            <td>{{ acc.bank_id }}</td>
            <td class="text-center" style="white-space:nowrap">
                <a href="{{ url_for('bank_accounts.edit', ref_num=acc.ref_num) }}"
                   class="btn btn-outline btn-sm">Edit Label</a>
                <form method="post" id="toggle-active-form-{{ acc.ref_num }}"
                      action="{{ url_for('bank_accounts.toggle_active', ref_num=acc.ref_num, show=show) }}"
                      style="display:inline">
                    <button type="button" class="btn btn-sm"
                            style="background:var(--accent-muted); color:var(--text-primary)"
                            onclick="showConfirmModal('{% if acc.is_active %}Deactivate{% else %}Activate{% endif %} {{ acc.bank_name }}?', function(){
                                document.getElementById('toggle-active-form-{{ acc.ref_num }}').submit();
                            }, {variant: 'primary'})">
                        {% if acc.is_active %}Deactivate{% else %}Activate{% endif %}
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
