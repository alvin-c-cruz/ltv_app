<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <title>LTV System — Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0c1a2e 0%, #162644 60%, #1e3560 100%);
        }

        .login-wrap {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-brand-name {
            font-size: 2.8rem;
            font-weight: 800;
            color: #e6c96a;
            letter-spacing: 6px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.4);
            line-height: 1;
        }

        .login-brand-sub {
            font-size: 0.78rem;
            color: rgba(197, 208, 222, 0.6);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 36px 40px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.2);
        }

        .login-card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a2236;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: 0.03em;
        }

        .login-flash {
            background: #fdf0f0;
            border: 1px solid #e8bbbb;
            border-left: 4px solid #a82828;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 20px;
            font-size: 0.875rem;
            color: #a82828;
        }

        .login-field {
            margin-bottom: 18px;
        }

        .login-field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #5a6070;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .login-field input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #dbd5c5;
            border-radius: 7px;
            font-size: 0.95rem;
            color: #1a2236;
            background: #fafaf8;
            transition: border-color 0.18s, box-shadow 0.18s;
            outline: none;
        }

        .login-field input:focus {
            border-color: #b8941f;
            box-shadow: 0 0 0 3px rgba(184,148,31,0.15);
            background: #fff;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: linear-gradient(135deg, #b8941f, #d4ac38);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            transition: opacity 0.18s, transform 0.1s;
            text-transform: uppercase;
        }

        .login-btn:hover  { opacity: 0.92; }
        .login-btn:active { transform: translateY(1px); }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.72rem;
            color: rgba(197, 208, 222, 0.45);
            letter-spacing: 0.05em;
        }

        @media (max-width: 440px) {
            .login-card { padding: 28px 24px; }
            .login-brand-name { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="login-wrap">

    <div class="login-brand">
        <div class="login-brand-name">LTV</div>
        <div class="login-brand-sub">Stock Management System</div>
    </div>

    <div class="login-card">
        <h2>Sign in to your account</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                <div class="login-flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('auth.login') }}">
            <div class="login-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       value="{{ username }}" autocomplete="off" required autofocus>
            </div>
            <div class="login-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="off" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

    <div class="login-footer">v{{ app_version }}</div>

</div>

</body>
</html>
